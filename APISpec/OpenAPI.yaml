---
openapi: 3.1.0
tags:
- name: AI Operations
  description: AI-powered report generation and processing
- name: Admission
  description: Operations for managing patient admissions
- name: Analytics
  description: Analytics and reporting statistics
- name: Appointment
  description: Operations for managing patient appointments
- name: Audit Log
  description: Access and query audit log entries
- name: Auth
  description: Authentication and login operations
- name: Billing Code
  description: Manage billing codes and pricing
- name: Clinical User
  description: Manage clinical users and their roles
- name: Communication Template
  description: Manage communication templates for notifications
- name: Department
  description: Manage hospital departments
- name: License
  description: License management and validation
- name: MFA
  description: Multi-factor authentication setup and verification
- name: PDF
  description: Generate and download PDF reports
- name: Patient
  description: Operations for managing patients and their reports
- name: Patient Bed
  description: Manage patient bed assignments
- name: Patient Bill
  description: Manage patient billing and invoices
- name: Patient Visit
  description: Track and manage patient visits
- name: Prescription
  description: Manage patient prescriptions
- name: Prescription Config
  description: Configure medical prescription parameters
- name: Quick Shortcut
  description: Manage quick-shortcut paragraph templates
- name: Report
  description: Operations for managing patient reports
- name: Report Template
  description: Manage report templates
- name: Smart Search
  description: Smart search across patients and reports
- name: Suggestion
  description: Auto-suggestion and recommendation engine
- name: System Config
  description: System-level configuration management
- name: User Assistance
  description: User help and assistance endpoints
- name: User Preference
  description: Manage user preferences and settings
- name: Vaccination
  description: Manage patient vaccination records
- name: Workspace
  description: Manage clinical workspaces
components:
  schemas:
    # ---------------------------------------------------------------------------
    # Common / envelope
    # ---------------------------------------------------------------------------
    APIMessageLoad:
      type: object
      properties:
        data:
          type: string
    APIResponse:
      type: object
      properties:
        apiResponse:
          type: string
        statusCode:
          type: string
    LineResponse:
      type: object
      properties:
        lines:
          type: array
          uniqueItems: true
          items:
            type: string
        paragraphs:
          type: array
          uniqueItems: true
          items:
            type: string
    # ---------------------------------------------------------------------------
    # Auth
    # ---------------------------------------------------------------------------
    AuthRequest:
      type: object
      properties:
        userName:
          type: string
        password:
          type: string
        mfaCode:
          type: string
        hospitalID:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        message:
          type: string
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    MfaStatusRequest:
      type: object
      properties:
        enabled:
          type: boolean
        verificationCode:
          type: string
    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
        qrCodeUri:
          type: string
        message:
          type: string
    # ---------------------------------------------------------------------------
    # Patient
    # ---------------------------------------------------------------------------
    PatientDTO:
      type: object
      description: Union of backend, web, and mobile patient models.
      properties:
        internalUUID:
          type: string
        patientID:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        contactNumber:
          type: string
        emailID:
          type: string
        gender:
          type: string
        address:
          type: string
        maritalStatus:
          type: string
        nationality:
          type: string
        creationTime:
          type: string
          format: date-time
        emergencyContactName:
          type: string
        emergencyContactNumber:
          type: string
        guardianName:
          type: string
        guardianContactNumber:
          type: string
        guardianRelation:
          type: string
        idProofType:
          type: string
        idProofValue:
          type: string
        patientIDProof:
          type: string
        patientIDProofType:
          type: string
        photoBase64:
          type: string
        reports:
          type: array
          items:
            $ref: "#/components/schemas/ReportDTO"
    # ---------------------------------------------------------------------------
    # Appointment  (reference: web app AppointmentDTO union)
    # ---------------------------------------------------------------------------
    AppointmentDTO:
      type: object
      description: >-
        Union of the web app (reference), backend, and mobile appointment models.
      properties:
        appointUUID:
          type: string
        patientUUID:
          type: string
        patientName:
          type: string
        patientGender:
          type: string
        patientAge:
          type: string
        patientContactNumber:
          type: string
        patientEmail:
          type: string
        patientMRN:
          type: string
        doctorID:
          type: string
        doctorName:
          type: string
        doctorPrefix:
          type: string
        departmentUUID:
          type: string
        department:
          type: string
        scheduledStartTime:
          type: string
          format: date-time
        scheduledEndTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          format: int32
        bufferMinutes:
          type: integer
          format: int32
        appointmentType:
          type: string
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        notes:
          type: string
        contactNumber:
          type: string
        referenceDocument:
          type: string
        bookedBy:
          type: string
        bookedAt:
          type: string
          format: date-time
        checkedInAt:
          type: string
          format: date-time
        checkedInBy:
          type: string
        consultationStartedAt:
          type: string
          format: date-time
        consultationStartedBy:
          type: string
        completedAt:
          type: string
          format: date-time
        completedBy:
          type: string
        cancelledAt:
          type: string
          format: date-time
        cancelledBy:
          type: string
        cancellationReason:
          type: string
        noShowAt:
          type: string
          format: date-time
        noShowMarkedBy:
          type: string
        noShowReason:
          type: string
        rescheduledFromUUID:
          type: string
        vitalsRecorded:
          type: boolean
        vitalsRecordedAt:
          type: string
          format: date-time
        vitalsRecordedBy:
          type: string
        visitUUID:
          type: string
        billingUUID:
          type: string
        prescriptionUUID:
          type: string
        visitType:
          type: string
        chiefComplaint:
          type: string
        vitalSigns:
          type: string
        actualStartTime:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    AppointmentStatus:
      type: string
      enum:
      - SCHEDULED
      - CHECKED_IN
      - VITALS_RECORDING
      - IN_PROGRESS_CONSULTATION
      - COMPLETED
      - NO_SHOW
      - CANCELLED
    AppointmentNotificationTemplateType:
      type: string
      enum:
      - CREATE_APPOINTMENT
      - EDIT_APPOINTMENT
      - CANCEL_APPOINTMENT
    # ---------------------------------------------------------------------------
    # Visit
    # ---------------------------------------------------------------------------
    PatientVisitDTO:
      type: object
      properties:
        visitUUID:
          type: string
        patientUUID:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        patientGender:
          type: string
        patientAge:
          type: integer
          format: int32
        doctorId:
          type: string
        doctorName:
          type: string
        department:
          type: string
        visitReferenceName:
          type: string
        referenceID:
          type: string
        actualStartTime:
          type: string
          format: date-time
        actualEndTime:
          type: string
          format: date-time
        visitType:
          type: string
        status:
          type: string
        chiefComplaint:
          type: string
        diagnosis:
          type: string
        vitalSigns:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VisitStatus:
      type: string
      enum:
      - CHECKED_IN
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    VisitType:
      type: string
      enum:
      - SCHEDULED
      - WALK_IN
      - EMERGENCY
      - FOLLOW_UP
    # ---------------------------------------------------------------------------
    # Admission
    # ---------------------------------------------------------------------------
    AdmissionDTO:
      type: object
      properties:
        admissionId:
          type: string
        patientUUID:
          type: string
        patientVisitUUID:
          type: string
        billingID:
          type: string
        patientName:
          type: string
        patientGender:
          type: string
        bedCode:
          type: string
        wardName:
          type: string
        roomNumber:
          type: string
        doctorId:
          type: string
        primaryAssignedDoctorName:
          type: string
        departmentName:
          type: string
        admissionDate:
          type: string
          format: date
        admissionTime:
          type: string
          format: date-time
        dischargeDate:
          type: string
          format: date
        dischargeTime:
          type: string
          format: date-time
        status:
          type: string
        admissionType:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        admissionInsuranceCategory:
          type: string
    # ---------------------------------------------------------------------------
    # Bed
    # ---------------------------------------------------------------------------
    PatientBedDTO:
      type: object
      properties:
        bedId:
          type: string
        bedCode:
          type: string
        status:
          type: string
        wardName:
          type: string
        roomNumber:
          type: string
        currentPatientId:
          type: string
        currentPatientName:
          type: string
        assignedAt:
          type: string
          format: date-time
        hasVentilatorSupport:
          type: boolean
        isIsolation:
          type: boolean
    # ---------------------------------------------------------------------------
    # Billing
    # ---------------------------------------------------------------------------
    PatientBillDTO:
      type: object
      description: Union of backend, web, and mobile bill models.
      properties:
        billId:
          type: string
        billingDocumentNumber:
          type: string
        visitUUID:
          type: string
        patientUUID:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        doctorID:
          type: string
        doctorId:
          type: string
        doctorName:
          type: string
        department:
          type: string
        departmentName:
          type: string
        contactNumber:
          type: string
        category:
          $ref: "#/components/schemas/BillCategory"
        status:
          $ref: "#/components/schemas/BillStatus"
        totalAmount:
          type: number
          format: double
        paidAmount:
          type: number
          format: double
        balanceAmount:
          type: number
          format: double
        billingDate:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        paidDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillingItemDTO"
        notes:
          type: string
        paymentMode:
          type: string
        paymentDetails:
          type: string
        appointmentUUID:
          type: string
        billingReferenceID:
          type: string
    BillingItemDTO:
      type: object
      properties:
        billingItemID:
          type: integer
          format: int32
        itemCode:
          type: string
        itemName:
          type: string
        itemCost:
          type: number
          format: double
        taxInPercentage:
          type: number
          format: double
        quantity:
          type: integer
          format: int32
        subtotal:
          type: number
          format: double
        taxAmount:
          type: number
          format: double
        total:
          type: number
          format: double
    PatientBillingPaymentHistory:
      type: object
      properties:
        paymentHistoryId:
          type: string
        billId:
          type: string
        paymentDate:
          type: string
          format: date-time
        amountPaid:
          type: number
          format: double
        paymentMode:
          type: string
        paymentDetails:
          type: string
        transactionReference:
          type: string
        notes:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        patientUUID:
          type: string
    BillStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - PAID
      - PARTIALLY_PAID
      - COMPLETED
      - REFUNDED
      - CANCELLED
    BillCategory:
      type: string
      enum:
      - CONSULTATION
      - LAB
      - PHARMACY
      - PROCEDURE
      - ADMISSION
      - EMERGENCY
      - IMAGING
      - OTHER
    BillingCode:
      type: object
      properties:
        billingCode:
          type: string
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        billingType:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # ---------------------------------------------------------------------------
    # Prescription  (union: backend flat fields + web items[]/vitals[])
    # ---------------------------------------------------------------------------
    PatientPrescriptionDTO:
      type: object
      description: >-
        Union of backend, web, and mobile prescription models. Includes both the
        flat single-medicine fields and the structured items/vitals arrays.
      properties:
        documentUUID:
          type: string
        documentNumber:
          type: string
        internalUUID:
          type: string
        prescriptionUUID:
          type: string
        patientUUID:
          type: string
        patientName:
          type: string
        visitUUID:
          type: string
        prescriptionDate:
          type: string
          format: date-time
        state:
          type: string
        notes:
          type: string
        notesWebcontent:
          type: string
        allergies:
          type: string
        allergiesWebcontent:
          type: string
        diagnosis:
          type: string
        diagnosisWebcontent:
          type: string
        doctorName:
          type: string
        doctorID:
          type: string
        chiefComplaint:
          type: string
        chiefComplaintWebcontent:
          type: string
        department:
          type: string
        medicineName:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        duration:
          type: string
        instructions:
          type: string
        vitalName:
          type: string
        value:
          type: string
        unit:
          type: string
        recordedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionItem"
        vitals:
          type: array
          items:
            $ref: "#/components/schemas/PatientVitals"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PrescriptionItem:
      type: object
      properties:
        itemId:
          type: string
        medicineName:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        duration:
          type: string
        quantity:
          type: integer
          format: int32
        instructions:
          type: string
        refillsAllowed:
          type: integer
          format: int32
    PatientVitals:
      type: object
      properties:
        vitalName:
          type: string
        value:
          type: string
        unit:
          type: string
        recordedAt:
          type: string
          format: date-time
    MedicalPrescriptionConfig:
      type: object
      properties:
        medicineCode:
          type: string
        medicineName:
          type: string
        genericName:
          type: string
        category:
          type: string
        drugType:
          type: string
        availableDosage:
          type: string
        commonFrequency:
          type: string
        standardDuration:
          type: string
        defaultInstructions:
          type: string
        warnings:
          type: string
        contraindications:
          type: string
        requiresPrescription:
          type: boolean
        isActive:
          type: boolean
        active:
          type: boolean
        manufacturer:
          type: string
        unitPrice:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    # ---------------------------------------------------------------------------
    # Reports
    # ---------------------------------------------------------------------------
    ReportDTO:
      type: object
      properties:
        reportInstanceUUID:
          type: string
        reportName:
          type: string
        reportStartDate:
          type: string
          format: date-time
        reportStatus:
          type: string
        assignedTo:
          type: string
        assignedDoctorName:
          type: string
        signedBy:
          type: string
        referredBy:
          type: string
        lastUpdatedTime:
          type: string
          format: date-time
        remarks:
          type: string
        templateRererenceID:
          type: string
        department:
          type: string
        reportId:
          type: string
    PatientReportDTO:
      type: object
      properties:
        reportInstanceUUID:
          type: string
        reportName:
          type: string
        reportID:
          type: string
        approvalCategory:
          type: string
        reportStartDate:
          type: string
          format: date-time
        reportEndDate:
          type: string
          format: date-time
        reportStatus:
          type: string
        assignedTo:
          type: string
        assignedDoctorName:
          type: string
        signedBy:
          type: string
        referredBy:
          type: string
        lastUpdatedTime:
          type: string
          format: date-time
        remarks:
          type: string
        templateRererenceID:
          type: string
        department:
          type: string
        patient:
          $ref: "#/components/schemas/PatientDTO"
        storageLocation:
          type: string
        reportOpenStatus:
          type: string
        openedBy:
          type: string
        category:
          type: string
    PatientReportSegmentDTO:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        title:
          type: string
        webContent:
          type: string
        textContent:
          type: string
        referenceSegment:
          type: string
        mandatory:
          type: string
        uiType:
          type: string
        uiOptions:
          type: array
          items:
            type: string
        segmentOrder:
          type: integer
          format: int32
    MyReportsDTO:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        reportName:
          type: string
        department:
          type: string
        reportStartDate:
          type: string
          format: date-time
        patientID:
          type: string
        gender:
          type: string
        patientUUID:
          type: string
        reportUUID:
          type: string
        status:
          type: string
    ReportTemplateDTO:
      type: object
      properties:
        reporttemplateUUID:
          type: string
        name:
          type: string
        createdOn:
          type: string
        createdBy:
          type: string
        department:
          type: string
        approvalCategory:
          type: string
        version:
          type: integer
          format: int32
        templateStatus:
          type: boolean
        htmlStatus:
          type: boolean
        segments:
          type: array
          items:
            $ref: "#/components/schemas/ReportTemplateSegmentDTO"
    ReportTemplateSegmentDTO:
      type: object
      properties:
        segmentUUID:
          type: string
        category:
          type: string
        title:
          type: string
        mandatory:
          type: string
        uiType:
          type: string
        uiOptions:
          type: array
          items:
            type: string
        webContent:
          type: string
        textContent:
          type: string
        segmentOrder:
          type: integer
          format: int32
    # ---------------------------------------------------------------------------
    # Vaccination
    # ---------------------------------------------------------------------------
    VaccinationRecordDTO:
      type: object
      properties:
        recordId:
          type: string
        patientUUID:
          type: string
        vaccineName:
          type: string
        manufacturer:
          type: string
        batchNumber:
          type: string
        dateAdministered:
          type: string
          format: date
        administeredBy:
          type: string
        doseNumber:
          type: integer
          format: int32
        route:
          type: string
        site:
          type: string
        adverseEffects:
          type: string
        recordVerified:
          type: boolean
        patientName:
          type: string
        patientAge:
          type: integer
          format: int32
        patientGender:
          type: string
    # ---------------------------------------------------------------------------
    # Clinical user / org / config (entity payloads with no dedicated DTO)
    # ---------------------------------------------------------------------------
    ClinicalUser:
      type: object
      properties:
        userName:
          type: string
        alias:
          type: string
        prefix:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        lastLoggedIn:
          type: string
          format: date
        email:
          type: string
        status:
          type: string
        contactNumber:
          type: string
        password:
          type: string
        assigenedDepartments:
          type: array
          items:
            $ref: "#/components/schemas/Department"
        assignedRoles:
          type: array
          items:
            type: string
        profile:
          type: string
        qualification:
          type: string
        lastPasswordChangeDate:
          type: string
          format: date-time
    Department:
      type: object
      properties:
        name:
          type: string
    CommunicationTemplate:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        itemInCategoty:
          type: string
        message:
          type: string
    QuickShortCutPara:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/QuickTypeId"
        content:
          type: string
    QuickTypeId:
      type: object
      properties:
        shortCut:
          type: string
        templateId:
          type: string
    SuggestionRequest:
      type: object
      properties:
        requestData:
          type: string
        contextData:
          type: string
    SystemConfig:
      type: object
      properties:
        id:
          type: integer
          format: int32
        passwordExpiryinDays:
          type: integer
          format: int32
    UserPreference:
      type: object
      properties:
        userName:
          type: string
        timeFormat:
          type: string
        dateFormat:
          type: string
        customSettings:
          type: object
          additionalProperties: {}
    ApplicationLicense:
      type: object
      properties:
        licenseKey:
          type: string
        type:
          type: string
        validityStart:
          type: string
          format: date
        validityEnd:
          type: string
          format: date
        licenseStatus:
          type: string
        organization:
          type: string
        address:
          type: string
        hospitalID:
          type: string
        contactNumber:
          type: string
        emailAddress:
          type: string
        usersLimit:
          type: integer
          format: int32
        reportFormatLimit:
          type: integer
          format: int32
        currentUsers:
          type: integer
          format: int32
        currentReportFormat:
          type: integer
          format: int32
        currentReports:
          type: integer
          format: int32
        features:
          type: array
          items:
            type: string
  securitySchemes:
    SecurityScheme:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication
paths:  
  /api/admissions/active:
    get:
      tags:
      - Admission
      responses:
        "200":
          description: OK
      summary: Get Active Admissions
  /api/admissions/all/{patientUUID}:
    get:
      tags:
      - Admission
      parameters:
      - name: patientUUID
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Get All Admissions
  /api/admissions/checkout/{admissionId}:
    put:
      tags:
      - Admission
      parameters:
      - name: admissionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Check Out Patient
  /api/admissions/create:
    post:
      tags:
      - Admission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionDTO"
        required: true
      responses:
        "200":
