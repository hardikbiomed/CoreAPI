components:
  securitySchemes:
    SecurityScheme:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication
  schemas:
    APIMessageLoad:
      type: object
      properties:
        data:
          type: string
    APIResponse:
      type: object
      properties:
        apiResponse:
          type: string
        statusCode:
          type: string
    AuthRequest:
      type: object
      properties:
        userName:
          type: string
        password:
          type: string
        mfaCode:
          type: string
        hospitalID:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        message:
          type: string
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    MfaStatusRequest:
      type: object
      properties:
        enabled:
          type: boolean
        verificationCode:
          type: string
    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
        qrCodeUri:
          type: string
        message:
          type: string
        username:
          type: string
          description: Username.
        issuer:
          type: string
          description: Issuer.
        otpAuthUrl:
          type: string
          description: Otp Auth Url.
        qrCodeDataUri:
          type: string
          description: Qr Code Data Uri.
    PatientDTO:
      type: object
      description: Union of backend, web, and mobile patient models.
      properties:
        internalUUID:
          type: string
        patientID:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        contactNumber:
          type: string
        emailID:
          type: string
        gender:
          type: string
        address:
          type: string
        maritalStatus:
          type: string
        nationality:
          type: string
        creationTime:
          type: string
          format: date-time
        emergencyContactName:
          type: string
        emergencyContactNumber:
          type: string
        guardianName:
          type: string
        guardianContactNumber:
          type: string
        guardianRelation:
          type: string
        idProofType:
          type: string
        idProofValue:
          type: string
        patientIDProof:
          type: string
        patientIDProofType:
          type: string
        photoBase64:
          type: string
        lastAccessedTime:
          type: string
          description: Last time the patient record was accessed.
        verificationStatus:
          type: string
          description: Verification state of the patient record.
        patientBedUUID:
          type: string
          description: Identifier of the bed the patient is currently assigned to.
